<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>選手ランキング｜ハンドレッドリーグ データベース</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css?v=11">
</head>

<body>
    <nav class="site-nav">
        <a href="index.html" class="site-brand">
          <img
            src="apple-touch-icon.png"
            class="site-brand-logo"
            alt=""
            aria-hidden="true">
          ハンドレッドリーグ データベース
</a>

<div class="site-nav-links">

  <a href="index.html#teamRanking">
    <i data-lucide="bar-chart-3"></i>
    チーム順位
  </a>

  <a href="players.html">
    <i data-lucide="users"></i>
    選手ランキング
  </a>

  <a href="awards.html">
    <i data-lucide="trophy"></i>
    個人賞
  </a>

  <a href="news.html">
    <i data-lucide="bell"></i>
    お知らせ
  </a>

</div>
      
        <div class="site-search">
          <input
            id="siteSearchInput"
            type="search"
            placeholder="選手名を検索"
            autocomplete="off"
          >
      
          <div
            id="siteSearchResults"
            class="site-search-results"
          ></div>
        </div>
      </nav>
  <header>
    <h1>
      <i data-lucide="user-round" class="ui-icon"></i>
      選手ランキング
    </h1>
    <p>ハンドレッドリーグ 個人成績</p>
  </header>

  <main class="players-page">

        <div class="filter-panel-title">
          <i data-lucide="sliders-horizontal"></i>
          <span>表示条件</span>
        </div>
      
        <div class="filter-row">
      
          <div class="filter-field">
            <label for="yearSelect">年度</label>
            <select id="yearSelect"></select>
          </div>
      
          <div
            id="leagueControl"
            class="filter-field"
          >
            <label for="leagueSelect">リーグ</label>
      
            <select id="leagueSelect">
              <option value="A">Aリーグ</option>
              <option value="B">Bリーグ</option>
            </select>
          </div>
      
        </div>
      
        <div class="filter-field">
          <label for="stageSelect">ステージ</label>
      
          <select id="stageSelect">
            <option value="レギュラー">レギュラー</option>
            <option value="Semi-Final">セミファイナル</option>
            <option value="Final">ファイナル</option>
          </select>
        </div>
      
      </section>

    <section class="players-ranking-section">

      <h2 id="rankingTitle">ポイントランキング</h2>

      <div id="playersArea">
        読み込み中...
      </div>

    </section>



    <a
  href="#"
  class="back-button"
  id="backButton"
>
  <i data-lucide="arrow-left"></i>
  戻る
</a>

</main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/common.js?v=12"></script>
  <script src="js/players.js"></script>
  
</body>
</html>
