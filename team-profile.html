<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>チーム情報｜ハンドレッドリーグ データベース</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <link rel="stylesheet" href="css/style.css?v=12">
</head>

<body>
    <nav class="site-nav">
        <a href="index.html" class="site-brand">
          <img
            src="apple-touch-icon.png"
            class="site-brand-logo"
            alt=""
            aria-hidden="true">
          ハンドレッドリーグ データベース
</a>

<div class="site-nav-links">

  <a href="index.html#teamRanking">
    <i data-lucide="bar-chart-3"></i>
    チーム順位
  </a>

  <a href="players.html">
    <i data-lucide="users"></i>
    選手ランキング
  </a>

  <a href="awards.html">
    <i data-lucide="trophy"></i>
    個人賞
  </a>

  <a href="news.html">
    <i data-lucide="bell"></i>
    お知らせ
  </a>

</div>
      
        <div class="site-search">
          <input
            id="siteSearchInput"
            type="search"
            placeholder="選手名を検索"
            autocomplete="off"
          >
      
          <div
            id="siteSearchResults"
            class="site-search-results"
          ></div>
        </div>
      </nav>

    <main class="main-content">
        <section class="team-profile-header">

            <h1 id="teamName">チーム情報</h1>
          
            <p class="team-subtitle">
              総合チームデータ
            </p>
          
            <div
              id="yearTabs"
              class="team-year-tabs"
            >
              <!-- JS -->
            </div>
          
            <a
              id="currentTeamPageLink"
              class="current-team-page-link"
              href="#"
            >
              <i data-lucide="activity"></i>
              現在のチーム詳細を見る
            </a>
          
          </section>
      
        <section class="team-summary-section">
          <h2 id="summaryTitle">
            <i data-lucide="trophy"></i>
            通算成績
          </h2>
      
          <div id="teamSummary" class="team-summary-grid">
            <!-- JSで成績カードを表示 -->
          </div>
        </section>
      
        <section class="team-season-history-section">
          <h2>
            <i data-lucide="chart-column"></i>
            年度別成績
          </h2>
      
          <div class="table-scroll">
            <table class="team-history-table">
              <thead>
                <tr>
                  <th>年度</th>
                  <th>リーグ</th>
                  <th>順位</th>
                  <th>試合数</th>
                  <th>ポイント</th>
                </tr>
              </thead>
      
              <tbody id="teamHistoryBody">
                <!-- JSで年度別成績を表示 -->
              </tbody>
            </table>
          </div>
        </section>
      
        <section class="team-player-section">
          <h2 id="playerListTitle">
            <i data-lucide="users"></i>
            歴代選手一覧
          </h2>

          <div
            class="team-player-column-controls"
            aria-label="一覧に表示する項目"
          >
            <span class="team-player-column-controls-label">
              表示項目
            </span>

            <span class="team-player-column-fixed">
              選手名
            </span>

            <button type="button" data-column="2" aria-pressed="true">
              在籍年度
            </button>

            <button type="button" data-column="3" aria-pressed="true">
              試合数
            </button>

            <button type="button" data-column="4" aria-pressed="true">
              ポイント
            </button>

            <button type="button" data-column="5" aria-pressed="true">
              トップ
            </button>

            <button type="button" data-column="6" aria-pressed="true">
              トップ率
            </button>

            <button type="button" data-column="7" aria-pressed="true">
              ラス回避率
            </button>

            <button type="button" data-column="8" aria-pressed="true">
              最高得点
            </button>
          </div>
      
          <div class="table-scroll">
            <table class="team-player-table">
              <thead>
                <tr>
                  <th>選手名</th>
                  <th>在籍年度</th>
                  <th>試合数</th>
                  <th>ポイント</th>
                  <th>トップ</th>
                  <th>トップ率</th>
                  <th>ラス回避率</th>
                  <th>最高得点</th>
                </tr>
              </thead>
      
              <tbody id="teamPlayerBody">
                <!-- JSで選手一覧を表示 -->
              </tbody>
            </table>
          </div>
        </section>
      
        <p id="teamProfileMessage" class="status-message">
          データを読み込んでいます…
        </p>
      
        <a
          href="#"
          class="back-button"
          id="backButton"
        >
          <i data-lucide="arrow-left"></i>
          戻る
        </a>
      </main>

</main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/common.js?v=13"></script>
<script src="js/team-profile.js?v=6"></script>
</body>
</html>
