<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    選手詳細｜ハンドレッドリーグ データベース
  </title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <link
    rel="stylesheet"
    href="css/style.css?v=12"
  >
  <link rel="stylesheet" href="css/admin-entry.css?v=1">
</head>

<body>

  <nav class="site-nav">

    <a
      href="index.html"
      class="site-brand"
    >
    <img
      src="apple-touch-icon.png"
      class="site-brand-logo"
      alt=""
      aria-hidden="true">
    ハンドレッドリーグ データベース
  </a>
  
  <div class="site-nav-links">

    <a href="index.html#teamRanking">
      <i data-lucide="bar-chart-3"></i>
      チーム順位
    </a>
  
    <a href="players.html">
      <i data-lucide="users"></i>
      選手ランキング
    </a>
  
    <a href="awards.html">
      <i data-lucide="trophy"></i>
      個人賞
    </a>
  
    <a href="news.html">
      <i data-lucide="bell"></i>
      お知らせ
    </a>
  
  </div>

    <div class="site-search">

      <input
        id="siteSearchInput"
        type="search"
        placeholder="選手名を検索"
        autocomplete="off"
      >

      <div
        id="siteSearchResults"
        class="site-search-results"
      ></div>

    </div>

  </nav>


  <header>

    <h1 id="playerTitle">
      読み込み中...
    </h1>

  </header>


  <div class="favorite-bar player-action-bar">

    <button
      id="favoriteButton"
      class="favorite-button"
      type="button"
    >
      <i data-lucide="star" class="ui-icon"></i>
      お気に入りに追加
    </button>
  
    <button
      id="playerScreenshotButton"
      class="player-screenshot-button"
      type="button"
    >
      <i data-lucide="camera"></i>
  
      <span>
        画像作成
      </span>
    </button>

    <a
      id="playerDetailedStatsButton"
      class="player-detailed-stats-button"
      href="player-stats.html"
      hidden
    >
      <i data-lucide="chart-no-axes-combined"></i>
      <span>詳細成績</span>
    </a>

    <button
      id="adminEntryButton"
      class="admin-entry-button"
      type="button"
      hidden
    >
      <i data-lucide="lock-keyhole"></i>
      <span>管理者</span>
    </button>
  
  </div>

  <dialog id="adminEntryDialog" class="admin-entry-dialog">
    <form id="adminEntryForm" method="dialog">
      <button
        id="adminEntryClose"
        class="admin-entry-close"
        type="button"
        aria-label="閉じる"
      >×</button>
      <div class="admin-entry-lock" aria-hidden="true">
        <i data-lucide="lock-keyhole"></i>
      </div>
      <h2>管理者確認</h2>
      <p>成績入力ページを開くにはパスワードを入力してください。</p>
      <label for="adminEntryPassword">パスワード</label>
      <input
        id="adminEntryPassword"
        type="password"
        autocomplete="current-password"
        required
      >
      <p id="adminEntryError" class="admin-entry-error" role="alert" hidden>
        パスワードが違います。
      </p>
      <button class="admin-entry-submit" type="submit">成績入力を開く</button>
    </form>
  </dialog>


  <main class="player-detail-page">

    <section id="playerInfo">
      読み込み中...
    </section>

    <section class="player-awards-section">

      <h2>
        <i data-lucide="trophy" class="ui-icon"></i>
        受賞歴
      </h2>

      <div id="playerAwards">
        読み込み中...
      </div>

    </section>


    <section class="player-head-to-head-section">

      <div class="player-head-to-head-header">

        <div class="player-head-to-head-title-row">
          <h2>
            <i data-lucide="swords" class="ui-icon"></i>
            直接対決選手検索
          </h2>

          <div
            id="headToHeadTapNote"
            class="player-head-to-head-tap-note"
            hidden
          >
            <i data-lucide="hand"></i>
            <span>タップで試合詳細</span>
          </div>
        </div>

        <p>
          相手選手を検索すると、歴代の直接対決成績を確認できます。
        </p>
      </div>

      <div class="player-head-to-head-search">

        <input
          id="headToHeadSearchInput"
          type="search"
          placeholder="対戦相手の選手名を検索"
          autocomplete="off"
          aria-label="直接対決する選手を検索"
        >

        <div
          id="headToHeadSearchResults"
          class="player-head-to-head-search-results"
        ></div>

      </div>

      <div id="headToHeadResult">
        <p class="player-head-to-head-empty">
          選手名を入力してください。
        </p>
      </div>

    </section>


    <section class="player-matches-section">

      <div class="matches-header">
    
        <h2>
          試合履歴
        </h2>
    
        <div class="matches-note">
          <i data-lucide="hand"></i>
          <span>タップで詳細</span>
        </div>
    
      </div>
    
      <div id="playerMatches">
        読み込み中...
      </div>
    
    </section>

    <a
    href="#"
    class="back-button"
    id="backButton"
  >
    <i data-lucide="arrow-left"></i>
    戻る
  </a>

</main>


  <div
    id="matchDetailModal"
    class="match-detail-modal"
    aria-hidden="true"
  >

    <div
      class="match-detail-overlay"
      data-close-match-modal
    ></div>

    <div
      class="match-detail-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="matchDetailTitle"
    >

    <button
    type="button"
    class="match-modal-close"
    data-close-match-modal
    aria-label="閉じる"
  >
    <i data-lucide="x"></i>
  </button>

      <h2 id="matchDetailTitle">
        対局詳細
      </h2>

      <div id="matchDetailBody">
        読み込み中...
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/common.js?v=13"></script>
  <script src="js/player.js"></script>
  <script src="js/admin-entry.js?v=2"></script>
  
</body>

</html>
