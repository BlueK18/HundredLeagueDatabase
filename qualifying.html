<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予選結果｜ハンドレッドリーグ データベース</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=13">
  <link rel="stylesheet" href="css/qualifying.css?v=3">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="site-brand">
      <img src="apple-touch-icon.png" class="site-brand-logo" alt="" aria-hidden="true">
      ハンドレッドリーグ データベース
    </a>
    <div class="site-search">
      <input id="siteSearchInput" type="search" placeholder="選手名を検索" autocomplete="off">
      <div id="siteSearchResults" class="site-search-results"></div>
    </div>
  </nav>

  <header class="qualifying-hero">
    <h1><i data-lucide="list-checks" class="ui-icon"></i>予選結果</h1>
    <p>本戦の総合成績には反映しません</p>
  </header>

  <main class="qualifying-page">
    <section class="qualifying-controls" aria-labelledby="qualifyingFilterTitle">
      <h2 id="qualifyingFilterTitle"><i data-lucide="sliders-horizontal"></i>表示条件</h2>
      <div class="qualifying-filter-grid">
        <label>年度<select id="qualifyingYear"></select></label>
        <label>リーグ<select id="qualifyingLeague"><option value="">すべて</option></select></label>
        <label class="qualifying-search-field">チーム・選手検索<input id="qualifyingSearch" type="search" placeholder="名前を入力" autocomplete="off"></label>
      </div>
    </section>

    <section class="qualifying-results qualifying-standings-section" aria-labelledby="qualifyingStandingsTitle">
      <h2 id="qualifyingStandingsTitle">予選チーム順位</h2>
      <p class="qualifying-section-note">予選結果だけで集計しています。本戦の総合成績には含まれません。</p>
      <div id="qualifyingStandings" class="qualifying-table-wrap" aria-live="polite">読み込み中...</div>
    </section>

    <section class="qualifying-results qualifying-standings-section" aria-labelledby="qualifyingPlayersTitle">
      <h2 id="qualifyingPlayersTitle">予選個人成績</h2>
      <div id="qualifyingPlayers" class="qualifying-table-wrap" aria-live="polite">読み込み中...</div>
    </section>

    <section class="qualifying-results" aria-labelledby="qualifyingResultsTitle">
      <h2 id="qualifyingResultsTitle">試合結果</h2>
      <div id="qualifyingResults" class="qualifying-result-list" aria-live="polite">読み込み中...</div>
    </section>

    <a href="index.html" class="back-button"><i data-lucide="arrow-left"></i>ホームへ戻る</a>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/common.js?v=15"></script>
  <script src="js/qualifying.js?v=5"></script>
</body>
</html>
