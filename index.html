<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ハンドレッドリーグ データベース
  </title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link
    rel="stylesheet"
    href="css/style.css?v=12"
  >
</head>

<body>

  <nav class="site-nav">

    <a
      href="index.html"
      class="site-brand"
    >
    <img
      src="apple-touch-icon.png"
      class="site-brand-logo"
      alt=""
      aria-hidden="true">
    ハンドレッドリーグ データベース
  </a>
  
  <div class="site-nav-links">

    <a href="index.html#teamRanking">
      <i data-lucide="bar-chart-3"></i>
      チーム順位
    </a>
  
    <a href="players.html">
      <i data-lucide="users"></i>
      選手ランキング
    </a>
  
    <a href="awards.html">
      <i data-lucide="trophy"></i>
      個人賞
    </a>
  
    <a href="news.html">
      <i data-lucide="bell"></i>
      お知らせ
    </a>
  
  </div>

    <div class="site-search">

      <input
        id="siteSearchInput"
        type="search"
        placeholder="選手名を検索"
        autocomplete="off"
      >

      <div
        id="siteSearchResults"
        class="site-search-results"
      ></div>

    </div>

  </nav>


  <header class="home-hero">

    <h1>
      <i data-lucide="trophy" class="ui-icon"></i>
      ハンドレッドリーグ データベース
    </h1>

    <p>
      公式データベース
    </p>

  </header>


  <main>

    <section class="favorites-section">

      <h2>
        <i data-lucide="star" class="ui-icon"></i>
        お気に入り選手
      </h2>

      <div id="favoritePlayersArea">
        お気に入り選手はいません
      </div>

    </section>


    <section class="home-navigation">

      <a
        class="home-menu-card"
        href="#teamRanking"
      >
        <span class="home-menu-icon">
          <i data-lucide="chart-no-axes-column-increasing"></i>
        </span>

        <strong>
          チーム順位
        </strong>

        <small>
          リーグ・ステージ別順位表
        </small>
      </a>


      <a
        class="home-menu-card"
        href="players.html"
      >
        <span class="home-menu-icon">
          <i data-lucide="user-round"></i>
        </span>

        <strong>
          選手ランキング
        </strong>

        <small>
          ポイント・個人成績一覧
        </small>
      </a>


      <a
        class="home-menu-card"
        href="awards.html"
      >
        <span class="home-menu-icon">
          <i data-lucide="trophy"></i>
        </span>

        <strong>
          個人賞
        </strong>

        <small>
          各部門TOP3
        </small>
      </a>

    </section>


    <section class="ranking-controls">

      <select id="yearSelect"></select>


      <div id="leagueControl">

        <select id="leagueSelect">

          <option value="A">
            Aリーグ
          </option>

          <option value="B">
            Bリーグ
          </option>

        </select>

      </div>


      <select id="stageSelect">

        <option value="レギュラー">
          レギュラー
        </option>

        <option value="Semi-Final">
          セミファイナル
        </option>

        <option value="Final">
          ファイナル
        </option>

      </select>

    </section>


    <section
      class="ranking"
      id="teamRanking"
    >

      <h2>
        <i data-lucide="trophy" class="ui-icon"></i>
        チーム順位
      </h2>

      <div id="teamTable">
        読み込み中...
      </div>

    </section>

    <a
  href="#"
  class="back-button"
  id="backButton"
>
  <i data-lucide="arrow-left"></i>
  戻る
</a>

</main>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/common.js?v=15"></script>
  <script src="js/app.js"></script>
  
</body>

</html>
