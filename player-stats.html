<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細成績｜ハンドレッドリーグ データベース</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=36">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="site-brand">
      <img src="apple-touch-icon.png" class="site-brand-logo" alt="" aria-hidden="true">
      ハンドレッドリーグ データベース
    </a>
    <div class="site-nav-links">
      <a href="index.html#teamRanking"><i data-lucide="bar-chart-3"></i>チーム順位</a>
      <a href="players.html"><i data-lucide="users"></i>選手ランキング</a>
      <a href="awards.html"><i data-lucide="trophy"></i>個人賞</a>
      <a href="news.html"><i data-lucide="bell"></i>お知らせ</a>
    </div>
    <div class="site-search">
      <input id="siteSearchInput" type="search" placeholder="選手名を検索" autocomplete="off">
      <div id="siteSearchResults" class="site-search-results"></div>
    </div>
  </nav>

  <header>
    <h1 id="playerDetailedTitle">詳細成績</h1>
  </header>

  <main class="player-detail-page detailed-stats-page">
    <section id="playerDetailedStats" class="detailed-stats-section" aria-labelledby="detailedStatsTitle">
      <h2 id="detailedStatsTitle">
        <span><i data-lucide="chart-no-axes-combined" class="ui-icon"></i>個人成績</span>
        <button id="detailedStatsImageButton" class="detailed-stats-image-button" type="button" hidden>
          <i data-lucide="camera"></i>画像を保存
        </button>
      </h2>
      <div id="playerDetailedStatsBody">読み込み中...</div>
    </section>

    <a href="player.html" class="back-button" id="playerStatsBackButton">
      <i data-lucide="arrow-left"></i>選手詳細へ戻る
    </a>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/common.js?v=13"></script>
  <script>
    document.getElementById("playerStatsBackButton").href =
      `player.html?${window.location.search.slice(1)}`;
  </script>
  <script src="js/player-stats.js?v=7"></script>
</body>
</html>
